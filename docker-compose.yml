services:
  postgres:
    image: postgres:18-alpine
    container_name: aatzhmair-postgres
    environment:
      POSTGRES_DB: aatzhmair
      POSTGRES_USER: aatzhmair
      POSTGRES_PASSWORD: aatzhmair
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aatzhmair"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: aatzhmair-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: aatzhmair-valkey
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.1.0
    container_name: aatzhmair-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    build: { context: ., dockerfile: user-service/Dockerfile }
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aatzhmair
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    build: { context: ., dockerfile: product-service/Dockerfile }
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aatzhmair
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_started }

  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aatzhmair
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_SERVICE_URL: http://product-service:8082
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_key_here}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
  
  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  pg_data: