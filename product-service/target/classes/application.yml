server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aatzhmair
    username: aatzhmair
    password: aatzhmair
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: product_schema
  flyway:
    schemas: product_schema
    default-schema: product_schema
    locations: classpath:db/migration
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-prod-min-32-bytes}
    expiration-ms: 3600000
