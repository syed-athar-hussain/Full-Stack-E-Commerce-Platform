server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/aatzhmair
    username: aatzhmair
    password: aatzhmair
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: product_schema
  flyway:
    schemas: product_schema
    default-schema: product_schema
    locations: classpath:db/migration
  elasticsearch:
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  threads:
    virtual:
      enabled: true
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service-indexer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.aatzhmair.common.events
        spring.json.value.default.type: com.aatzhmair.common.events.ProductChangedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true


management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-prod-min-32-bytes}
    expiration-ms: 3600000
