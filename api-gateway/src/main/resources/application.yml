server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/products/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/orders/**
  
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # trace every request locally; dial this down in real production
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-prod-min-32-bytes}